<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Detect</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #bdc3c7;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        .upload-area:hover {
            border-color: #3498db;
            background-color: #f1f9ff;
        }
        #imagePreview {
            max-width: 100%;
            border-radius: 10px;
            display: none;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            display: none;
            width: 100%;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            display: none;
        }
        .result-box.success { background-color: #e8f8f5; border: 1px solid #1abc9c; }
        .result-box.danger { background-color: #fdf2e9; border: 1px solid #e67e22; }
        .diagnosis-text { font-size: 18px; font-weight: 800; color: #2c3e50; }
        .confidence-text { font-size: 32px; font-weight: 800; margin-top: 10px; }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Diabetes Detect From Eye Data</h1>
    <p>Please upload an eye data</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">Click for select a data</span>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
    </div>

    <img id="imagePreview" src="" alt="Eye Preview">
    
    <button id="analyzeBtn" class="btn" onclick="uploadAndPredict()">Analyze</button>
    <div id="loader" class="loader"></div>

    <div id="resultBox" class="result-box">
        <div class="diagnosis-text" id="diagnosisResult"></div>
        <div class="confidence-text" id="confidenceResult"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const img = document.getElementById('imagePreview');
            img.src = reader.result;
            img.style.display = 'block';
            document.getElementById('uploadText').innerText = "Select different photo";
            document.getElementById('analyzeBtn').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
        }
        selectedFile = event.target.files[0];
        reader.readAsDataURL(event.target.files[0]);
    }

    async function uploadAndPredict() {
        if (!selectedFile) return;

        document.getElementById('analyzeBtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const response = await fetch('/predict/', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('analyzeBtn').style.display = 'block';

            if (data.status === "success") {
                const resultBox = document.getElementById('resultBox');
                resultBox.style.display = 'block';

                if (data.diagnosis.includes("Healthy")) {
                    resultBox.className = "result-box success";
                    document.getElementById('confidenceResult').style.color = "#1abc9c";
                } else {
                    resultBox.className = "result-box danger";
                    document.getElementById('confidenceResult').style.color = "#e74c3c";
                }

                document.getElementById('diagnosisResult').innerText = data.diagnosis;
                document.getElementById('confidenceResult').innerText = "%" + data.confidence + " probability";
            } else {
                alert("Error: " + data.message);
            }
        } catch (error) {
            alert("Could not connect to server.");
            document.getElementById('loader').style.display = 'none';
            document.getElementById('analyzeBtn').style.display = 'block';
        }
    }
</script>

</body>
</html>
